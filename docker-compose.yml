# JanusPrime service stack — memory + cognition + local LLM (bundled Ollama)
# REQUIRED: copy .env.example to .env before `docker compose up` (secrets and paths are not inlined).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: janusprime-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || wget -q -O /dev/null http://127.0.0.1:11434/api/tags || ollama list >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  memory:
    build:
      context: ./Smart-Library
      dockerfile: Dockerfile
    container_name: janusprime-memory
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - USE_DOCKER_SANDBOX=true
      - SANDBOX_FAIL_CLOSED=true
      # Smart-Library reads API_KEY; Janus orchestrator uses JANUS_MEMORY_API_KEY (same value).
      - API_KEY=${JANUS_MEMORY_API_KEY:-${API_KEY:-}}
    volumes:
      - ./Smart-Library/.chroma_db:/app/.chroma_db
      - ./Smart-Library/.hf_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request, json; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); d=json.load(r); exit(0 if d.get('status')=='ok' else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  cognition:
    build:
      context: ${REL_BUILD_CONTEXT:-C:/REL_Codex_Variant}
      dockerfile: Dockerfile
    container_name: janusprime-cognition
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - REL_PATH=/app/runtime
      - REL_LOG_FORMAT=json
      - REL_LOG_LEVEL=INFO
      - REL_API_AUTH_REQUIRED=${REL_API_AUTH_REQUIRED:-false}
      - REL_ADMIN_USERNAME=${REL_ADMIN_USERNAME:-admin}
      - REL_ADMIN_PASSWORD=${REL_ADMIN_PASSWORD:?REL_ADMIN_PASSWORD is required — copy .env.example to .env}
      - REL_OAUTH2_SECRET=${REL_OAUTH2_SECRET:?REL_OAUTH2_SECRET is required — copy .env.example to .env}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ${REL_DATA_PATH:-C:/REL_Codex_Variant/data}:/app/runtime/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/health >/dev/null || wget -q -O /dev/null http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  ollama_data: