# JanusPrime service stack — memory + cognition + local LLM
# Usage: copy .env.example to .env, then: docker compose up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: janusprime-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  memory:
    build:
      context: ./Smart-Library
      dockerfile: Dockerfile
    container_name: janusprime-memory
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - USE_DOCKER_SANDBOX=true
      - SANDBOX_FAIL_CLOSED=true
    volumes:
      - ./Smart-Library/.chroma_db:/app/.chroma_db
      - ./Smart-Library/.hf_cache:/app/.hf_cache
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama
    restart: unless-stopped

  cognition:
    build:
      context: ${REL_BUILD_CONTEXT:-C:/REL_Codex_Variant}
      dockerfile: Dockerfile
    container_name: janusprime-cognition
    ports:
      - "8080:8080"
    environment:
      - REL_PATH=/app/runtime
      - REL_LOG_FORMAT=json
      - REL_LOG_LEVEL=INFO
      - REL_API_AUTH_REQUIRED=${REL_API_AUTH_REQUIRED:-false}
      - REL_ADMIN_USERNAME=${REL_ADMIN_USERNAME:-admin}
      - REL_ADMIN_PASSWORD=${REL_ADMIN_PASSWORD:-janusprime-local}
      - REL_OAUTH2_SECRET=${REL_OAUTH2_SECRET:-janusprime-local-oauth2-secret-change-me}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ${REL_DATA_PATH:-C:/REL_Codex_Variant/data}:/app/runtime/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: