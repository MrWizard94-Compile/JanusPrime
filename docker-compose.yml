# JanusPrime service stack — memory + local LLM
# Usage: docker compose up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: janusprime-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  memory:
    build:
      context: ./Smart-Library
      dockerfile: Dockerfile
    container_name: janusprime-memory
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - USE_DOCKER_SANDBOX=true
      - SANDBOX_FAIL_CLOSED=true
    volumes:
      - ./Smart-Library/.chroma_db:/app/.chroma_db
      - ./Smart-Library/.hf_cache:/app/.hf_cache
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: